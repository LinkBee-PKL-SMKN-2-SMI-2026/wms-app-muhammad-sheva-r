openapi: 3.1.0
info:
  title: Example API
  version: 1.0.0
  description: Example CRUD module — full CRUD with bulk operations and nested items
servers:
  - url: http://localhost:3000/api
    description: Local development

paths:
  /example:
    get:
      summary: Get all examples
      description: Retrieve paginated examples with search, filter, and sort
      tags:
        - Example
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Items per page (default 10, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: search
          in: query
          required: false
          description: Search by name (case-insensitive)
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort by name
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: isActive
          in: query
          required: false
          description: Filter by active status
          schema:
            type: boolean
      responses:
        "200":
          description: Examples retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPaginatedResponse"

    post:
      summary: Create a new example
      tags:
        - Example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExampleRequest"
      responses:
        "201":
          description: Example created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Example"
        "409":
          description: Example name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /example/bulk:
    post:
      summary: Bulk create examples
      description: Create multiple examples at once. Each item is processed individually — successful ones return in `data`, failures in `failed`.
      tags:
        - Example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreateRequest"
      responses:
        "201":
          description: Bulk create completed (partial success possible)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Example"
                  failed:
                    type: array
                    items:
                      $ref: "#/components/schemas/BulkCreateFailedItem"

  /example/with-items:
    post:
      summary: Create example with nested items
      tags:
        - Example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWithItemsRequest"
      responses:
        "201":
          description: Example with items created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateWithItemsResponse"
        "400":
          description: Duplicate product names in request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Example name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /example/{id}:
    get:
      summary: Get example by ID
      tags:
        - Example
      parameters:
        - name: id
          in: path
          required: true
          description: Example ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Example retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExampleWithItems"
        "404":
          description: Example not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Full update an example
      tags:
        - Example
      parameters:
        - name: id
          in: path
          required: true
          description: Example ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExampleRequest"
      responses:
        "200":
          description: Example updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Example"
        "404":
          description: Example not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Name conflicts with another record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      summary: Partial update an example
      tags:
        - Example
      parameters:
        - name: id
          in: path
          required: true
          description: Example ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartialUpdateExampleRequest"
      responses:
        "200":
          description: Example partially updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Example"
        "400":
          description: No fields provided for update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Example not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Name conflicts with another record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete an example
      tags:
        - Example
      parameters:
        - name: id
          in: path
          required: true
          description: Example ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Example deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Example"
        "404":
          description: Example not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates whether the request was successful
        message:
          type: string
          description: Response message
        data:
          description: Response payload
      required:
        - success
        - message

    ApiPaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ExampleWithItems"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - success
        - message
        - data
        - pagination

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Items per page
        total:
          type: integer
          description: Total number of items
        totalPages:
          type: integer
          description: Total number of pages
      required:
        - page
        - limit
        - total
        - totalPages

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Error message
        errors:
          type: object
          description: Field-level validation errors
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - success
        - message

    Example:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Example ID
        name:
          type: string
          description: Example name
        description:
          type: string
          nullable: true
          description: Example description
        isActive:
          type: boolean
          description: Active status
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
      required:
        - id
        - name
        - isActive
        - createdAt
        - updatedAt

    ExampleWithItems:
      allOf:
        - $ref: "#/components/schemas/Example"
        - type: object
          properties:
            items:
              type: array
              description: Related items
              items:
                $ref: "#/components/schemas/ExampleItem"
          required:
            - items

    ExampleItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Item ID
        productName:
          type: string
          description: Product name
        quantity:
          type: integer
          description: Quantity
        price:
          type: integer
          description: Price in smallest currency unit (e.g. cents)
        exampleId:
          type: string
          format: uuid
          description: Parent example ID
      required:
        - id
        - productName
        - quantity
        - price
        - exampleId

    CreateExampleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          description: Example name (min 3 characters)
        description:
          type: string
          description: Example description
        isActive:
          type: boolean
          default: true
          description: Active status (defaults to true)

    UpdateExampleRequest:
      type: object
      required:
        - name
        - isActive
      properties:
        name:
          type: string
          minLength: 3
          description: Example name (min 3 characters)
        description:
          type: string
          description: Example description
        isActive:
          type: boolean
          description: Active status

    PartialUpdateExampleRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          description: Example name (min 3 characters)
        description:
          type: string
          description: Example description
        isActive:
          type: boolean
          description: Active status

    BulkCreateRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: Array of examples to create (1-50 items)
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                minLength: 3
                description: Example name (min 3 characters)
              description:
                type: string
                description: Example description
              isActive:
                type: boolean
                default: true
                description: Active status

    BulkCreateFailedItem:
      type: object
      properties:
        index:
          type: integer
          description: Index of the failed item in the request array
        name:
          type: string
          description: Name of the failed item
        reason:
          type: string
          description: Failure reason
      required:
        - index
        - name
        - reason

    ItemInput:
      type: object
      required:
        - productName
        - quantity
        - price
      properties:
        productName:
          type: string
          minLength: 1
          description: Product name
        quantity:
          type: integer
          exclusiveMinimum: 0
          description: Quantity (must be > 0)
        price:
          type: integer
          exclusiveMinimum: 0
          description: Price in smallest currency unit (must be > 0)

    CreateWithItemsRequest:
      type: object
      required:
        - name
        - category
        - items
      properties:
        name:
          type: string
          minLength: 3
          description: Example name (min 3 characters)
        category:
          type: string
          minLength: 1
          description: Category name
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: Array of items (1-20 items)
          items:
            $ref: "#/components/schemas/ItemInput"

    CreateWithItemsResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Example ID
        name:
          type: string
          description: Example name
        category:
          type: string
          description: Category name
        items:
          type: array
          description: Created items
          items:
            $ref: "#/components/schemas/ExampleItem"
        totalItems:
          type: integer
          description: Sum of all item quantities
        totalValue:
          type: integer
          description: Sum of all item price * quantity
      required:
        - id
        - name
        - category
        - items
        - totalItems
        - totalValue
