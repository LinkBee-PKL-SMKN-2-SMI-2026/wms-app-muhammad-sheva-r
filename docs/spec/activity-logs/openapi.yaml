openapi: 3.1.0
info:
  title: Activity Logs Module API
  version: 1.0.0
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /activity-logs:
    get:
      summary: Mengambil daftar riwayat aktivitas sistem (Audit Trail)
      tags:
        - Activity Logs
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 100
        - in: query
          name: userId
          schema:
            type: string
            format: uuid
        - in: query
          name: action
          schema:
            type: string
            enum: [CREATE, UPDATE, DELETE, LOGIN, LOGOUT]
        - in: query
          name: entity
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Berhasil mengambil daftar log aktivitas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Activity logs retrieved successfully'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        userId:
                          type: string
                          format: uuid
                        user:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            email:
                              type: string
                              format: email
                        action:
                          type: string
                          enum: [CREATE, UPDATE, DELETE, LOGIN, LOGOUT]
                        entity:
                          type: string
                        entityId:
                          type: string
                          format: uuid
                          nullable: true
                        details:
                          type: object
                          additionalProperties: true
                          nullable: true
                        ipAddress:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '401':
          description: Tidak terautentikasi (token tidak ditemukan, tidak valid, atau sudah kedaluwarsa)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Token tidak valid atau sudah kadaluwarsa'