openapi: 3.1.0
info:
  title: Products Module API
  version: 1.0.0
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /products:
    get:
      summary: Mengambil semua produk dengan filter
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
            description: Pencarian berdasarkan nama, SKU, atau deskripsi
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: locationId
          schema:
            type: string
            format: uuid
        - in: query
          name: sort
          schema:
            type: string
            default: createdAt
      responses:
        '200':
          description: Berhasil mengambil data produk
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductWithRelations'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '401':
          description: Tidak terautentikasi
    post:
      summary: Membuat produk baru (Admin & Manager)
      tags:
        - Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - sku
                - categoryId
                - locationId
              properties:
                name:
                  type: string
                sku:
                  type: string
                description:
                  type: string
                stock:
                  type: integer
                  default: 0
                minimumStock:
                  type: integer
                  default: 0
                categoryId:
                  type: string
                  format: uuid
                locationId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Produk berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  message:
                    type: string
                    example: 'Produk berhasil dibuat'
                  data:
                    $ref: '#/components/schemas/ProductWithRelations'
        '400':
          description: SKU sudah digunakan oleh produk lain
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'error'
                  message:
                    type: string
                    example: 'SKU sudah digunakan oleh produk lain'
        '401':
          description: Tidak terautentikasi
        '403':
          description: Tidak memiliki akses (hanya ADMIN atau MANAGER)
        '404':
          description: Kategori atau lokasi tidak ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'error'
                  message:
                    type: string
                    example: 'Kategori tidak ditemukan'

  /products/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Mengambil detail produk
      tags:
        - Products
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Detail produk berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  data:
                    $ref: '#/components/schemas/ProductWithRelations'
        '401':
          description: Tidak terautentikasi
        '404':
          description: Produk tidak ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'error'
                  message:
                    type: string
                    example: 'Produk tidak ditemukan'
    put:
      summary: Mengubah produk (Admin & Manager)
      description: Stock tidak bisa diupdate dari sini, melainkan melalui Stock Movements.
      tags:
        - Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                sku:
                  type: string
                description:
                  type: string
                minimumStock:
                  type: integer
                categoryId:
                  type: string
                  format: uuid
                locationId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Produk berhasil diubah
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  message:
                    type: string
                    example: 'Produk berhasil diperbarui'
                  data:
                    $ref: '#/components/schemas/ProductWithRelations'
        '400':
          description: SKU sudah digunakan oleh produk lain
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'error'
                  message:
                    type: string
                    example: 'SKU sudah digunakan oleh produk lain'
        '401':
          description: Tidak terautentikasi
        '403':
          description: Tidak memiliki akses (hanya ADMIN atau MANAGER)
        '404':
          description: Produk, kategori, atau lokasi tidak ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'error'
                  message: