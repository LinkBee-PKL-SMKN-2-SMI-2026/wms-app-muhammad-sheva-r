openapi: 3.1.0
info:
  title: Stock Movements Module API
  version: 1.0.0
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /movements/inbound:
    post:
      summary: Mencatat barang masuk (Inbound)
      tags:
        - Stock Movements
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: string
                  format: uuid
                  description: ID dari produk
                quantity:
                  type: integer
                  minimum: 1
                  description: Jumlah barang masuk (harus lebih dari 0)
                notes:
                  type: string
                  description: Catatan opsional
      responses:
        '201':
          description: Berhasil mencatat inbound dan stok bertambah

  /movements/outbound:
    post:
      summary: Mencatat barang keluar (Outbound)
      tags:
        - Stock Movements
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  minimum: 1
                notes:
                  type: string
      responses:
        '201':
          description: Berhasil mencatat outbound dan stok berkurang
        '400':
          description: Gagal karena stok tidak mencukupi

  /movements/history:
    get:
      summary: Mengambil riwayat pergerakan stok
      tags:
        - Stock Movements
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: productId
          schema:
            type: string
            format: uuid
        - in: query
          name: type
          schema:
            type: string
            enum: [INBOUND, OUTBOUND]
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Berhasil mengambil riwayat pergerakan stok
